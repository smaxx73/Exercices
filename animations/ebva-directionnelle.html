<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const W={};
// Formules : \( … \) en ligne, \[ … \] en bloc, rendues par KaTeX une fois chargé.
function rm(el){
  if(!window.renderMathInElement)return;
  renderMathInElement(el||document.body,{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false})}
window.addEventListener('load',()=>{rm(document.body);fit()});
// ---------------------------------------------------------------------------
// Noyau commun des diaporamas OPTRN : figures SVG, lignes de niveau, utilitaires.
// Les widgets d'un diaporama (widgets.js) s'enregistrent dans W[nom] ; une slide
// les appelle avec <div data-w="nom">. Le gabarit rappelle W[nom](élément) à
// chaque affichage de la slide : un widget ne s'initialise donc qu'une fois
// (el._ok) et se redessine ensuite.
// ---------------------------------------------------------------------------
const SVGNS='http://www.w3.org/2000/svg';
let _uid=0;
function mk(tag,attrs,parent){
  const e=document.createElementNS(SVGNS,tag);
  for(const k in attrs||{})e.setAttribute(k,attrs[k]);
  if(parent)parent.append(e);return e}
function html(tag,attrs,parent,txt){
  const e=document.createElement(tag);
  for(const k in attrs||{})e.setAttribute(k,attrs[k]);
  if(parent)parent.append(e);
  if(txt!=null){e.innerHTML=txt;rm(e)}
  return e}
const fmt=(x,d=3)=>{
  if(!isFinite(x))return x>0?'+∞':x<0?'−∞':'—';
  if(x!==0&&Math.abs(x)<1e-3||Math.abs(x)>=1e5){
    const [m,e]=x.toExponential(2).split('e'),sup={'-':'⁻','+':'','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
    return m.replace('-','−').replace('.',',')+'·10'+[...e].map(c=>sup[c]).join('')}
  return (+x.toFixed(d)).toString().replace('-','−').replace('.',',')};

// nombre pour une formule TeX : virgule décimale « {,} »
const tn=(x,d=3)=>fmt(x,d).replace(',','{,}');

// Repère SVG : coordonnées « données » → pixels, avec calques et découpage.
// m = marges {l,r,t,b} en pixels.
class Plot{
  constructor(svg,{w,h,xr,yr,m={l:44,r:14,t:14,b:34}}){
    this.svg=svg;this.w=w;this.h=h;this.xr=xr;this.yr=yr;this.m=m;
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('class','plot');
    svg.setAttribute('width',w);svg.setAttribute('height',h);
    this.id='clip'+(++_uid);
    const d=mk('defs',{},svg);
    const c=mk('clipPath',{id:this.id},d);
    mk('rect',{x:m.l,y:m.t,width:w-m.l-m.r,height:h-m.t-m.b},c);
    for(const [id,col] of [['ah','#b85d3f'],['ahk','#0d3c4d'],['aht','#3a8f8f']]){
      const mr=mk('marker',{id:this.id+id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},d);
      mk('path',{d:'M0,0 L10,5 L0,10 z',fill:col},mr)}
    this.back=mk('g',{},svg);          // quadrillage et axes
    this.gs={};
  }
  X(x){const m=this.m;return m.l+(x-this.xr[0])/(this.xr[1]-this.xr[0])*(this.w-m.l-m.r)}
  Y(y){const m=this.m;return this.h-m.b-(y-this.yr[0])/(this.yr[1]-this.yr[0])*(this.h-m.t-m.b)}
  // position (en coordonnées données) d'un événement souris/tactile, malgré le zoom du diaporama
  at(ev){
    const p=this.svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;
    const q=p.matrixTransform(this.svg.getScreenCTM().inverse()),m=this.m;
    return [this.xr[0]+(q.x-m.l)/(this.w-m.l-m.r)*(this.xr[1]-this.xr[0]),
            this.yr[0]+(this.h-m.b-q.y)/(this.h-m.t-m.b)*(this.yr[1]-this.yr[0])]}
  // calque nommé, vidé à chaque appel (clip=true : découpé au cadre du repère)
  layer(name,clip=true){
    let g=this.gs[name];
    if(!g){g=this.gs[name]=mk('g',clip?{'clip-path':`url(#${this.id})`}:{},this.svg)}
    g.replaceChildren();return g}
  axes({xt,yt,xl,yl,grid=true,zero=true}={}){
    const g=this.back,m=this.m;g.replaceChildren();
    const [x0,x1]=this.xr,[y0,y1]=this.yr;
    const ticks=(a,b)=>{const out=[],s=Math.pow(10,Math.floor(Math.log10((b-a)/6))),
      st=[1,2,5,10].map(k=>k*s).find(k=>(b-a)/k<=8);for(let v=Math.ceil(a/st-1e-9)*st;v<=b+1e-9;v+=st)out.push(+v.toFixed(10));return out};
    for(const v of xt||ticks(x0,x1)){
      if(grid)mk('line',{x1:this.X(v),x2:this.X(v),y1:m.t,y2:this.h-m.b,class:'grid'},g);
      mk('text',{x:this.X(v),y:this.h-m.b+17,'text-anchor':'middle',class:'tick'},g).textContent=fmt(v,2)}
    for(const v of yt||ticks(y0,y1)){
      if(grid)mk('line',{y1:this.Y(v),y2:this.Y(v),x1:m.l,x2:this.w-m.r,class:'grid'},g);
      mk('text',{x:m.l-7,y:this.Y(v)+4,'text-anchor':'end',class:'tick'},g).textContent=fmt(v,2)}
    mk('rect',{x:m.l,y:m.t,width:this.w-m.l-m.r,height:this.h-m.t-m.b,class:'axis'},g);
    if(zero){
      if(x0<0&&x1>0)mk('line',{x1:this.X(0),x2:this.X(0),y1:m.t,y2:this.h-m.b,class:'axis',opacity:.5},g);
      if(y0<0&&y1>0)mk('line',{y1:this.Y(0),y2:this.Y(0),x1:m.l,x2:this.w-m.r,class:'axis',opacity:.5},g)}
    if(xl)this.label(g,this.w-m.r-4,this.h-m.b-16,xl,'end');
    if(yl)this.label(g,m.l+6,m.t+14,yl,'start')}
  // étiquette HTML/KaTeX (position en pixels) : s peut contenir des formules \( … \)
  label(g,px,py,s,anchor='start',cls=''){
    const w=300,h=30;
    const fo=mk('foreignObject',{x:anchor==='end'?px-w:anchor==='middle'?px-w/2:px,y:py-h/2,width:w,height:h},g);
    const d=html('div',{class:'fo-in '+cls,style:'justify-content:'+(anchor==='end'?'flex-end':anchor==='middle'?'center':'flex-start')},fo);
    d.innerHTML='<span>'+s+'</span>';rm(d);return fo}
  // même chose en coordonnées données
  math(g,x,y,s,cls='',anchor='start',dx=0,dy=0){return this.label(g,this.X(x)+dx,this.Y(y)+dy,s,anchor,cls)}
  // nouvelle plage (puis rappeler axes())
  range(xr,yr){this.xr=xr;this.yr=yr}
  // carte de couleur : une cellule par point d'une grille n×n, color(valeur) → couleur CSS
  heat(g,f,n,color){
    const [x0,x1]=this.xr,[y0,y1]=this.yr,dx=(x1-x0)/n,dy=(y1-y0)/n,m=this.m;
    const wpx=(this.w-m.l-m.r)/n+0.6,hpx=(this.h-m.t-m.b)/n+0.6;
    for(let j=0;j<n;j++)for(let i=0;i<n;i++){
      const v=f(x0+(i+.5)*dx,y0+(j+.5)*dy);
      mk('rect',{x:this.X(x0+i*dx).toFixed(1),y:(this.Y(y0+(j+1)*dy)-0.3).toFixed(1),width:wpx.toFixed(1),height:hpx.toFixed(1),fill:color(v)},g)}}
  // tracés (g = calque, pts = [[x,y],…] en coordonnées données)
  poly(g,pts,cls='path'){
    return mk('path',{d:pts.map((p,i)=>(i?'L':'M')+this.X(p[0]).toFixed(1)+' '+this.Y(p[1]).toFixed(1)).join(''),class:cls},g)}
  fn(g,f,a,b,n=200,cls='curve'){
    const pts=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;pts.push([x,f(x)])}return this.poly(g,pts,cls)}
  dot(g,x,y,r=6,cls='pt'){return mk('circle',{cx:this.X(x),cy:this.Y(y),r,class:cls},g)}
  line(g,x1,y1,x2,y2,cls='ref'){return mk('line',{x1:this.X(x1),y1:this.Y(y1),x2:this.X(x2),y2:this.Y(y2),class:cls},g)}
  arrow(g,x1,y1,x2,y2,cls='gr',head='aht'){
    return mk('line',{x1:this.X(x1),y1:this.Y(y1),x2:this.X(x2),y2:this.Y(y2),class:cls,'marker-end':`url(#${this.id}${head})`},g)}
  text(g,x,y,s,cls='',anchor='start',dx=0,dy=0){
    const t=mk('text',{x:this.X(x)+dx,y:this.Y(y)+dy,'text-anchor':anchor,class:cls,'font-size':16},g);t.textContent=s;return t}
  // lignes de niveau : segments de marching squares, tracés en un seul <path> par niveau
  // skip(x0,y0,x1,y1) : renvoie true pour ignorer une cellule (ex. discontinuité de f)
  contours(g,f,levels,n=110,cls='lvl',skip=null){
    const [x0,x1]=this.xr,[y0,y1]=this.yr,dx=(x1-x0)/n,dy=(y1-y0)/n;
    const v=[];for(let j=0;j<=n;j++){const r=[];for(let i=0;i<=n;i++)r.push(f(x0+i*dx,y0+j*dy));v.push(r)}
    for(const L of levels){
      let d='';
      const cut=(a,b,pa,pb)=>{const t=(L-a)/(b-a);return [pa[0]+t*(pb[0]-pa[0]),pa[1]+t*(pb[1]-pa[1])]};
      for(let j=0;j<n;j++)for(let i=0;i<n;i++){
        const a=v[j][i],b=v[j][i+1],c=v[j+1][i+1],e=v[j+1][i];
        const A=[x0+i*dx,y0+j*dy],B=[x0+(i+1)*dx,y0+j*dy],C=[x0+(i+1)*dx,y0+(j+1)*dy],D=[x0+i*dx,y0+(j+1)*dy];
        if(skip&&skip(A[0],A[1],C[0],C[1]))continue;
        const code=(a>L?1:0)|(b>L?2:0)|(c>L?4:0)|(e>L?8:0);
        if(code===0||code===15)continue;
        const bot=()=>cut(a,b,A,B),rig=()=>cut(b,c,B,C),top=()=>cut(e,c,D,C),lef=()=>cut(a,e,A,D);
        let s=[];
        switch(code){case 1:case 14:s=[[lef(),bot()]];break;case 2:case 13:s=[[bot(),rig()]];break;
          case 3:case 12:s=[[lef(),rig()]];break;case 4:case 11:s=[[rig(),top()]];break;
          case 6:case 9:s=[[bot(),top()]];break;case 7:case 8:s=[[lef(),top()]];break;
          case 5:s=[[lef(),top()],[bot(),rig()]];break;case 10:s=[[lef(),bot()],[top(),rig()]];break}
        for(const [p,q] of s)d+=`M${this.X(p[0]).toFixed(1)} ${this.Y(p[1]).toFixed(1)}L${this.X(q[0]).toFixed(1)} ${this.Y(q[1]).toFixed(1)}`}
      if(d)mk('path',{d,class:cls},g)}}
}

// Curseur avec sortie : renvoie {el, input, set(v)}.
function slider(parent,{label,min,max,step,value,onInput,show=v=>fmt(v,2)}){
  const lab=html('label',{},parent);
  html('span',{},lab,label);
  const inp=html('input',{type:'range',min,max,step,value},lab);
  const out=html('span',{class:'mono',style:'min-width:3.6em;display:inline-block'},lab);
  const upd=()=>{out.textContent=show(+inp.value)};
  inp.addEventListener('input',()=>{upd();onInput(+inp.value)});upd();
  return {el:lab,input:inp,set(v){inp.value=v;upd()},get value(){return +inp.value}}}
function button(parent,txt,onClick,cls='action'){
  const b=html('button',{type:'button',class:cls},parent,txt);b.addEventListener('click',onClick);return b}
// Boutons exclusifs (choix d'une valeur) : renvoie {set(v)}
function segmented(parent,opts,onPick){
  const box=html('span',{class:'seg'},parent),bs={};
  for(const [v,txt] of opts){bs[v]=button(box,txt,()=>{pick(v);onPick(v)},'')}
  const pick=v=>{for(const k in bs)bs[k].classList.toggle('on',k===v)};
  return {set:pick}}
// lecture pas à pas : play(tick) appelle tick() toutes les ms jusqu'à ce qu'il renvoie false
function ticker(ms=550){
  let t=null;
  return {start(tick){this.stop();t=setInterval(()=>{if(tick()===false)this.stop()},ms)},
          stop(){if(t){clearInterval(t);t=null}},get on(){return t!==null}}}

// remplace le contenu d'un élément et rend ses formules
const put=(e,s)=>{e.innerHTML=s;rm(e)};
// Deux colonnes : figure à gauche, commandes et lectures à droite. Un <template> dans l'élément
// fournit un texte d'introduction placé en tête de la colonne de droite.
function twoCols(el,left=700){
  const tpl=el.querySelector('template'),intro=tpl?tpl.innerHTML:'';
  el.replaceChildren();
  el.style.cssText=`display:grid;grid-template-columns:${left}px 1fr;gap:26px;align-items:start`;
  const L=html('div',{},el),R=html('div',{},el);
  if(intro)html('div',{class:'intro'},R,intro);
  return [L,R]}
// Révélation pas à pas : <div data-w="steps"> dont les enfants de classe .st apparaissent un à un.
W.steps=el=>{
  if(!el._ok){

    const items=[...el.querySelectorAll(':scope>.st')];

// ============ Exercice 1PPl : f(s,t)=s²t+e^{st}, u=x²+y, v=x−y², z=f(u,v) ======
const fST=(s,t)=>s*s*t+Math.exp(s*t);
const fS=(s,t)=>2*s*t+t*Math.exp(s*t);          // ∂f/∂s
const fT=(s,t)=>s*s+s*Math.exp(s*t);            // ∂f/∂t
const uF=(x,y)=>x*x+y, vF=(x,y)=>x-y*y;
const zF=(x,y)=>fST(uF(x,y),vF(x,y));
const ST={s0:0.8,t0:0.6,x:1,y:1};
const sgn=(v,d=3)=>(v<0?'-':'')+tn(Math.abs(v),d);   // nombre signé pour une formule

// ---- Slide : une dérivée partielle est la dérivée d'une tranche -----------------
function widgetTranche(el){
  if(!el._ok){
    el._ok=true;
    el.replaceChildren();
    el.style.cssText='display:grid;grid-template-columns:470px 1fr;gap:24px;align-items:start';
    const L=html('div',{},el),R=html('div',{},el);
    const svg=mk('svg',{},L);
    const P=el._P=new Plot(svg,{w:470,h:392,xr:[-2,2],yr:[-1.65,1.65],m:{l:36,r:12,t:12,b:30}});
    P.axes({xl:'\\(s\\)',yl:'\\(t\\)',xt:[-2,-1,0,1,2],yt:[-1,0,1]});
    P.contours(P.layer('lv'),fST,[-8,-4,-2,-1,0.25,0.5,1,2,3,5,8,12],110,'lvl');
    svg.style.cursor='crosshair';
    svg.addEventListener('click',ev=>{const [s,t]=P.at(ev);set(Math.round(s*20)/20,Math.round(t*20)/20)});
    const ctl=html('div',{class:'controls',style:'flex-direction:column;align-items:flex-start;margin:8px 0 0;gap:4px'},L);
    el._a=slider(ctl,{label:'\\(s_0\\) =',min:-2,max:2,step:0.05,value:ST.s0,onInput:v=>{ST.s0=v;draw()}});
    el._b=slider(ctl,{label:'\\(t_0\\) =',min:-1.6,max:1.6,step:0.05,value:ST.t0,onInput:v=>{ST.t0=v;draw()}});
    const mkPlot=()=>{const sv=mk('svg',{},R);sv.style.marginBottom='8px';return new Plot(sv,{w:630,h:178,xr:[-2,2],yr:[0,1],m:{l:44,r:12,t:10,b:28}})};
    const PA=mkPlot(),PB=mkPlot();
    el._ro=html('div',{class:'ro'},R);
    const set=(s,t)=>{ST.s0=Math.max(-2,Math.min(2,s));ST.t0=Math.max(-1.6,Math.min(1.6,t));draw()};
    const slice=(Q,g,fn,x0,slope,cls,name)=>{
      const xs=[];for(let i=0;i<=120;i++)xs.push(-2+4*i/120);
      const ys=xs.map(fn);let lo=Math.min(...ys),hi=Math.max(...ys);const pad=(hi-lo)*0.12||1;
      Q.range([-2,2],[lo-pad,hi+pad]);Q.axes({xl:name.x,yl:name.y});
      const gg=Q.layer(g);Q.poly(gg,xs.map((x,i)=>[x,ys[i]]),cls);
      const y0=fn(x0);Q.line(gg,x0-0.7,y0-0.7*slope,x0+0.7,y0+0.7*slope,'path');
      Q.dot(gg,x0,y0,7,'pt')};
    const draw=()=>{
      const {s0,t0}=ST;
      const g=P.layer('a');
      P.line(g,-2,t0,2,t0,'red');P.line(g,s0,-1.65,s0,1.65,'gr');
      P.dot(g,s0,t0,7,'pt');
      slice(PA,'a',s=>fST(s,t0),s0,fS(s0,t0),'red',{x:'\\(s\\)',y:'\\(f(s,t_0)\\)'});
      slice(PB,'a',t=>fST(s0,t),t0,fT(s0,t0),'gr',{x:'\\(t\\)',y:'\\(f(s_0,t)\\)'});
      PB.range([-2,2],PB.yr);
      const h=1e-6,ns=(fST(s0+h,t0)-fST(s0-h,t0))/(2*h),nt=(fST(s0,t0+h)-fST(s0,t0-h))/(2*h);
      put(el._ro,`<table><tr><td>\\(\\dfrac{\\partial f}{\\partial s}(s_0,t_0)=2s_0t_0+t_0e^{s_0t_0}\\)</td><td class="n"><b style="color:var(--red)">${fmt(fS(s0,t0),3)}</b></td><td class="n small">pente mesurée : ${fmt(ns,3)}</td></tr>
        <tr><td>\\(\\dfrac{\\partial f}{\\partial t}(s_0,t_0)=s_0^2+s_0e^{s_0t_0}\\)</td><td class="n"><b style="color:var(--teal)">${fmt(fT(s0,t0),3)}</b></td><td class="n small">pente mesurée : ${fmt(nt,3)}</td></tr></table>`);
      el._a.set(s0);el._b.set(t0);
    };
    el._draw=draw;
  }
  el._draw()}
W.tranche=widgetTranche;

// ---- Slide : règle des chaînes = somme sur les chemins du graphe ------------------
function widgetGraphe(el){
  if(!el._ok){
    el._ok=true;
    const [L,R]=twoCols(el,560);
    const svg=mk('svg',{},L);
    const P=el._P=new Plot(svg,{w:560,h:430,xr:[0,560],yr:[0,430],m:{l:0,r:0,t:0,b:0}});
    const N={x:[70,330],y:[70,100],u:[290,330],v:[290,100],z:[500,215]};
    const E=[['x','u','\\(u_x=2x\\)'],['x','v','\\(v_x=1\\)'],['y','u','\\(u_y=1\\)'],['y','v','\\(v_y=-2y\\)'],['u','z','\\(f_s\\)'],['v','z','\\(f_t\\)']];
    const st=el._st={tgt:'x',step:0};
    const seg=segmented(html('div',{class:'controls',style:'margin:0 0 6px'},R),[['x','\\(\\partial z/\\partial x\\)'],['y','\\(\\partial z/\\partial y\\)']],v=>{st.tgt=v;st.step=0;draw()});
    el._seg=seg;
    const bar=html('div',{class:'controls',style:'margin:0 0 4px;gap:8px'},R);
    button(bar,'Chemin suivant ▸',()=>{st.step=Math.min(3,st.step+1);draw()});
    button(bar,'Recommencer',()=>{st.step=0;draw()});
    const ctl=html('div',{class:'controls',style:'margin:2px 0;gap:6px 18px'},R);
    slider(ctl,{label:'\\(x\\) =',min:-2,max:2,step:0.1,value:ST.x,onInput:v=>{ST.x=v;draw()}});
    slider(ctl,{label:'\\(y\\) =',min:-2,max:2,step:0.1,value:ST.y,onInput:v=>{ST.y=v;draw()}});
    el._ro=html('div',{class:'ro',style:'margin-top:4px'},R);
    const draw=()=>{
      const {tgt,step}=st,{x,y}=ST,u=uF(x,y),v=vF(x,y);
      seg.set(tgt);
      const via=n=>[[tgt,n],[n,'z']];            // arêtes d'un chemin
      const lit=new Set();
      if(step>=1)via('u').forEach(e=>lit.add(e.join()));
      if(step>=2)via('v').forEach(e=>lit.add(e.join()));
      const g=P.layer('a',false);
      E.forEach(([a,b,lab])=>{
        const on=lit.has(a+','+b),[x1,y1]=N[a],[x2,y2]=N[b];
        const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d,r=34;
        mk('line',{x1:P.X(x1+ux*r),y1:P.Y(y1+uy*r),x2:P.X(x2-ux*(r+4)),y2:P.Y(y2-uy*(r+4)),class:on?'e1':'e0','marker-end':`url(#${P.id}${on?'ah':'ahk'})`,opacity:on?1:.8},g);
        // étiquette : à une fraction de l'arête, décalée du côté gauche (normale)
        const fr=(a==='u'||a==='v')?0.5:(dy===0?0.5:0.22),nx=-uy,ny=ux;
        P.label(g,P.X(x1+dx*fr+nx*19),P.Y(y1+dy*fr+ny*19),lab,'middle',on?'o':'');
      });
      const names={x:'x',y:'y',u:'u',v:'v',z:'z'};
      for(const k in N){
        const on=(k===tgt)||(k==='z')||(k==='u'&&step>=1)||(k==='v'&&step>=2);
        mk('circle',{cx:P.X(N[k][0]),cy:P.Y(N[k][1]),r:30,class:'nd'+(on&&step>0?' on':'')},g);
        P.label(g,P.X(N[k][0]),P.Y(N[k][1]),`\\(${names[k]}\\)`,'middle');
      }
      // lectures numériques au point (x,y)
      const fs=fS(u,v),ft=fT(u,v);
      const a1=tgt==='x'?2*x:1,a2=tgt==='x'?1:-2*y,p1=fs*a1,p2=ft*a2,tot=p1+p2;
      const h=1e-6,num=tgt==='x'?(zF(x+h,y)-zF(x-h,y))/(2*h):(zF(x,y+h)-zF(x,y-h))/(2*h);
      const t=tgt;
      let s=`<p class="small" style="margin:0 0 4px">Au point \\((x,y)=(${tn(x,1)},${tn(y,1)})\\) : \\((u,v)=(${tn(u,2)},${tn(v,2)})\\)</p>`;
      if(step>=1)s+=`<p style="margin:3px 0">chemin par \\(u\\) : \\(f_s(u,v)\\,u_${t}=${tn(fs,3)}\\times ${sgn(a1,2)}=\\mathbf{${sgn(p1,3)}}\\)</p>`;
      if(step>=2)s+=`<p style="margin:3px 0">chemin par \\(v\\) : \\(f_t(u,v)\\,v_${t}=${tn(ft,3)}\\times ${sgn(a2,2)}=\\mathbf{${sgn(p2,3)}}\\)</p>`;
      if(step>=3)s+=`<div class="status" style="margin:6px 0"><b>On additionne les chemins :</b> \\(\\dfrac{\\partial z}{\\partial ${t}}=${sgn(p1,3)}+(${sgn(p2,3)})=${sgn(tot,3)}\\)<br><span class="small">différence finie centrée : ${fmt(num,3)}</span></div>`;
      if(step===0)s+=`<p class="small" style="margin:4px 0">Choisissez une variable puis allumez les chemins qui mènent de \\(${t}\\) à \\(z\\).</p>`;
      put(el._ro,s);
    };
    el._draw=draw;
  }
  el._draw()}
W.graphe=widgetGraphe;

// ---- Slide : vérification numérique, et le piège de l'évaluation -------------------
function widgetChaineNum(el){
  if(!el._ok){
    el._ok=true;
    const [L,R]=twoCols(el,560);
    const st=el._st={tgt:'x'};
    const seg=segmented(html('div',{class:'controls',style:'margin:0 0 6px'},L),[['x','\\(\\partial z/\\partial x\\)'],['y','\\(\\partial z/\\partial y\\)']],v=>{st.tgt=v;draw()});
    el._seg=seg;
    const ctl=html('div',{class:'controls',style:'margin:2px 0 8px;gap:6px 18px'},L);
    slider(ctl,{label:'\\(x\\) =',min:-2,max:2,step:0.1,value:ST.x,onInput:v=>{ST.x=v;draw()}});
    slider(ctl,{label:'\\(y\\) =',min:-2,max:2,step:0.1,value:ST.y,onInput:v=>{ST.y=v;draw()}});
    el._q=html('div',{class:'ro'},L);
    el._r=html('div',{class:'ro'},R);
    const draw=()=>{
      const {tgt}=st,{x,y}=ST,u=uF(x,y),v=vF(x,y),t=tgt;
      seg.set(tgt);
      const dux=tgt==='x'?2*x:1,dvx=tgt==='x'?1:-2*y;
      const good=fS(u,v)*dux+fT(u,v)*dvx;
      const bad=fS(x,y)*dux+fT(x,y)*dvx;       // erreur : partielles évaluées en (x,y)
      const z0=zF(x,y);
      const rows=[1,0.1,0.01,0.001,0.0001].map(h=>{
        const q=((tgt==='x'?zF(x+h,y):zF(x,y+h))-z0)/h;
        return `<tr><td class="n">\\(h=${tn(h,4)}\\)</td><td class="n">${fmt(q,4)}</td><td class="n small">écart ${fmt(Math.abs(q-good),4)}</td></tr>`}).join('');
      put(el._q,`<p class="small" style="margin:0 0 4px">Quotient \\(\\dfrac{z(${t==='x'?'x+h,y':'x,y+h'})-z(x,y)}{h}\\) :</p><table>${rows}</table>`);
      const near=Math.abs(good-bad)<1e-3;
      put(el._r,`<table>
        <tr><td colspan="2"><b>Bonne évaluation</b> : \\(f_s,f_t\\) en \\((u,v)=(${tn(u,2)},${tn(v,2)})\\)</td></tr>
        <tr><td class="small">\\(f_s(u,v)\\,u_${t}+f_t(u,v)\\,v_${t}\\)</td><td class="n"><b class="ok">${fmt(good,4)}</b></td></tr>
        <tr><td colspan="2" style="padding-top:12px"><b>Erreur fréquente</b> : \\(f_s,f_t\\) en \\((x,y)=(${tn(x,1)},${tn(y,1)})\\)</td></tr>
        <tr><td class="small">\\(f_s(x,y)\\,u_${t}+f_t(x,y)\\,v_${t}\\)</td><td class="n"><b class="${near?'wr':'bad'}">${fmt(bad,4)}</b></td></tr></table>
        <div class="status ${near?'o':'r'}" style="margin-top:10px">${near?'Ici les deux valeurs coïncident par hasard : changer \\(x\\) ou \\(y\\).':'Les dérivées partielles de \\(f\\) se calculent en \\((s,t)\\), puis <b>on remplace</b> \\(s=u(x,y)\\), \\(t=v(x,y)\\).'}</div>`);
    };
    el._draw=draw;
  }
  el._draw()}
W.chainenum=widgetChaineNum;

// ============ Exercice ebva : f(x,y)=y²/x (x≠0), f(0,y)=y ====================
const fE=(x,y)=>Math.abs(x)<1e-12?y:y*y/x;
const STC={mode:'parabole',m:1,c:1,tau:1};

    const ctl=html('div',{class:'controls',style:'flex-direction:column;align-items:flex-start;margin:10px 0 0;gap:6px'},R);
    el._seg=segmented(ctl,[['parabole','parabole \\(x=y^2/c\\)'],['droite','droite \\(y=mx\\)']],m=>{STC.mode=m;draw()});
    el._sp=slider(ctl,{label:'\\(c\\) =',min:-3,max:3,step:0.25,value:STC.c,onInput:v=>{STC.c=Math.abs(v)<0.01?0.25:v;draw()}});
    el._sm=slider(ctl,{label:'\\(m\\) =',min:-3,max:3,step:0.25,value:STC.m,onInput:v=>{STC.m=v;draw()}});
    const row=html('div',{class:'controls',style:'margin:0;gap:8px'},ctl);
    const tk=el._tk=ticker(60);
    button(row,'▶ Approcher (0,0)',()=>{STC.tau=1;draw();tk.start(()=>{STC.tau=Math.max(0.0,STC.tau-0.01);draw();return STC.tau>0})});
    el._st=slider(ctl,{label:'\\(\\tau\\) =',min:0,max:1,step:0.01,value:STC.tau,onInput:v=>{tk.stop();STC.tau=v;draw()}});
    el._ro=html('div',{class:'ro',style:'margin-top:6px'},R);
    const path=tt=>STC.mode==='parabole'?[tt*tt/STC.c,tt]:[tt,STC.m*tt];
    const draw=()=>{
      const {mode,c,m,tau}=STC;
      el._seg.set(mode);
      el._sp.el.style.display=mode==='parabole'?'':'none';
      el._sm.el.style.display=mode==='droite'?'':'none';
      const g=P.layer('a');
      const pts=[];for(let i=0;i<=100;i++)pts.push(path(i/100*1.15));
      P.poly(g,pts.filter(p=>Math.abs(p[0])<1.5&&Math.abs(p[1])<1.5),'path');
      if(mode==='parabole'){const pn=[];for(let i=0;i<=100;i++)pn.push([(i/100*1.15)**2/c,-(i/100)*1.15]);P.poly(g,pn.filter(p=>Math.abs(p[0])<1.5),'path')}
      const [px,py]=path(tau);P.dot(g,px,py,8,'pt');P.dot(g,0,0,6,'pt t');
      const fv=mode==='parabole'?c:m*m*tau;
      const gq=Q.layer('a');
      Q.poly(gq,[[0,0],[1,0]].map(p=>p),'ref');
      const curve=[];for(let i=1;i<=100;i++){const tt=i/100;curve.push([tt,mode==='parabole'?c:m*m*tt])}
      Q.poly(gq,curve,'path');
      const lim=mode==='parabole'?c:0;
      Q.dot(gq,0,lim,7,'pt');Q.dot(gq,0,0,6,'pt t');
      Q.dot(gq,tau,fv,8,'pt k');
      put(el._ro,`<table><tr><td>point \\((x,y)\\)</td><td class="n">(${fmt(px,3)} ; ${fmt(py,3)})</td></tr>
        <tr><td>\\(f(x,y)\\) le long du chemin</td><td class="n"><b class="${Math.abs(lim)>1e-9?'bad':'ok'}">${fmt(fv,3)}</b></td></tr>
        <tr><td>limite quand \\(\\tau\\to 0\\)</td><td class="n"><b>${fmt(lim,3)}</b></td></tr>
        <tr><td>valeur \\(f(0,0)\\)</td><td class="n"><b>0</b></td></tr></table>`);
      el._st.set(tau);
    };
    el._draw=draw;
  }
  el._draw()}
W.continuite=widgetContinuite;

// ---- Slide : directions et dérivée directionnelle (4 contre 2) --------------------
const STD={deg:63.4349};
function widgetDirectionnelle(el){
  if(!el._ok){
    el._ok=true;
    const [L,R]=twoCols(el,420);
    const svg=mk('svg',{},L);
    const P=el._P=new Plot(svg,{w:420,h:420,xr:[-1.4,1.4],yr:[-1.4,1.4],m:{l:30,r:10,t:10,b:26}});
    P.axes({xl:'\\(x\\)',yl:'\\(y\\)',xt:[-1,0,1],yt:[-1,0,1]});
    const cc=P.layer('c');P.poly(cc,Array.from({length:181},(_,i)=>[Math.cos(i/90*Math.PI),Math.sin(i/90*Math.PI)]),'ref');
    html('p',{class:'small',style:'margin:0 0 3px'},R,'<b style="color:var(--teal)">▬</b> \\(\\nabla f(0,0)\\cdot u=\\sin\\theta\\) (formule) &nbsp; <b style="color:var(--orange)">▬</b> \\(\\lim_{t\\to0}f(tu)/t=u_2^2/u_1\\) (réalité)');
    const svg2=mk('svg',{},R);
    const Q=el._Q=new Plot(svg2,{w:690,h:240,xr:[0,360],yr:[-3,3],m:{l:44,r:14,t:12,b:34}});
    Q.axes({xl:'\\(\\theta\\) (degrés)',yl:'\\(\\partial_u f(0,0)\\)',xt:[0,90,180,270,360],yt:[-3,-2,-1,0,1,2,3]});
    // courbes fixes : ∇f(0,0)·u = sin θ (vert) et limite réelle u₂²/u₁ (orange), en rouge les écarts
    const gf=Q.layer('f');
    Q.poly(gf,Array.from({length:361},(_,i)=>[i,Math.sin(i*Math.PI/180)]),'gr');
    let seg=[];const segs=[];
    for(let i=0;i<=720;i++){const th=i/2,u1=Math.cos(th*Math.PI/180),u2=Math.sin(th*Math.PI/180);
      if(Math.abs(u1)<0.03){if(seg.length)segs.push(seg);seg=[]}else seg.push([th,u2*u2/u1])}
    if(seg.length)segs.push(seg);
    segs.forEach(s=>Q.poly(gf,s,'path'));
    [90,270].forEach(th=>Q.dot(gf,th,Math.sin(th*Math.PI/180),5,'pt'));
    const ctl=html('div',{class:'controls',style:'flex-direction:column;align-items:flex-start;margin:8px 0 0;gap:6px'},R);
    el._s=slider(ctl,{label:'direction \\(\\theta\\) =',min:0,max:360,step:1,value:STD.deg,show:v=>v+'°',onInput:v=>{STD.deg=v;draw()}});
    const row=html('div',{class:'controls',style:'margin:0;gap:8px'},ctl);
    button(row,'\\(u\\propto(1,0)\\)',()=>{STD.deg=0;draw()});
    button(row,'\\(u\\propto(1,1)\\)',()=>{STD.deg=45;draw()});
    button(row,'\\(u\\propto(1,2)\\)',()=>{STD.deg=Math.atan2(2,1)*180/Math.PI;draw()});
    el._ro=html('div',{class:'ro',style:'margin-top:6px'},R);
    const draw=()=>{
      const th=STD.deg*Math.PI/180,u1=Math.cos(th),u2=Math.sin(th);
      const g=P.layer('a');
      P.arrow(g,0,0,0,1,'gr','aht');P.math(g,0,1,'\\(\\nabla f(0,0)\\)','t','start',8,-6);
      P.arrow(g,0,0,u1,u2,'path','ah');P.math(g,u1,u2,'\\(u\\)','o','start',8,-8);
      const real=Math.abs(u1)<1e-9?u2:u2*u2/u1,pred=u2;
      const gq=Q.layer('m');
      Q.line(gq,STD.deg,-3,STD.deg,3,'ref');
      Q.dot(gq,STD.deg,pred,7,'pt t');
      if(Math.abs(real)<=3)Q.dot(gq,STD.deg,real,7,'pt');
      const same=Math.abs(real-pred)<0.02;
      put(el._ro,`<table><tr><td>\\(u=(\\cos\\theta,\\sin\\theta)\\)</td><td class="n">(${fmt(u1,3)} ; ${fmt(u2,3)})</td></tr>
        <tr><td>\\(\\lim_{t\\to0}\\dfrac{f(tu)-f(0,0)}{t}\\)</td><td class="n"><b class="${same?'ok':'bad'}">${fmt(real,3)}</b></td></tr>
        <tr><td>\\(\\nabla f(0,0)\\cdot u\\)</td><td class="n"><b>${fmt(pred,3)}</b></td></tr></table>
        <div class="status ${same?'':'r'}" style="margin-top:8px">${same?'Les deux valeurs coïncident : seulement pour \\(\\theta=0\\), \\(\\pi/4\\), \\(\\pi\\), … et les directions des axes.':'<b>La formule \\(\\nabla f\\cdot u\\) est fausse ici</b>, bien que \\(\\partial_xf\\) et \\(\\partial_yf\\) existent.'}</div>`);
      el._s.set(STD.deg);
    };
    el._draw=draw;
  }
  el._draw()}
W.directionnelle=widgetDirectionnelle;

// ============ Exercice ClxN : lignes de niveau et gradient ====================
const fC=(x,y)=>(x-2)*(x-2)+4*(y+1)*(y+1);
const STG={p:[0,0],deg:0};
function widgetGradient(el){
  if(!el._ok){
    el._ok=true;
    const [L,R]=twoCols(el,560);
    const svg=mk('svg',{},L);
    const P=el._P=new Plot(svg,{w:560,h:426,xr:[-1.5,4.5],yr:[-3.4,1.1]});
    P.axes({xl:'\\(x\\)',yl:'\\(y\\)',xt:[-1,0,1,2,3,4],yt:[-3,-2,-1,0,1]});
    P.contours(P.layer('lv'),fC,[0.25,0.5,1,2,4,6,9,13,18,25,34,45],110,'lvl');
    svg.style.cursor='crosshair';
    svg.addEventListener('click',ev=>{const [x,y]=P.at(ev);STG.p=[Math.round(x*10)/10,Math.round(y*10)/10];draw()});
    const svg2=mk('svg',{},R);
    const Q=el._Q=new Plot(svg2,{w:540,h:230,xr:[0,360],yr:[-10,10],m:{l:44,r:14,t:12,b:34}});
    Q.axes({xl:'\\(\\theta\\) (degrés)',yl:'variation de \\(f\\)',xt:[0,90,180,270,360],yt:[-10,-5,0,5,10]});
    const ctl=html('div',{class:'controls',style:'flex-direction:column;align-items:flex-start;margin:8px 0 0;gap:6px'},R);
    el._s=slider(ctl,{label:'déplacement \\(\\theta\\) =',min:0,max:360,step:1,value:STG.deg,show:v=>v+'°',onInput:v=>{STG.deg=v;draw()}});
    const row=html('div',{class:'controls',style:'margin:0;gap:8px'},ctl);
    button(row,'→ horizontal',()=>{STG.deg=0;draw()});
    button(row,'↑ vertical',()=>{STG.deg=90;draw()});
    el._ro=html('div',{class:'ro',style:'margin-top:6px'},R);
    const draw=()=>{
      const [x,y]=STG.p,gx=2*(x-2),gy=8*(y+1),gn=Math.hypot(gx,gy),th=STG.deg*Math.PI/180;
      const g=P.layer('a');
      if(gn>1e-9){
        // tangente à la ligne de niveau (⟂ au gradient) et flèche de plus forte décroissance
        const tx=-gy/gn,ty=gx/gn;P.line(g,x-1.1*tx,y-1.1*ty,x+1.1*tx,y+1.1*ty,'ref');
        P.arrow(g,x,y,x-gx/gn*0.9,y-gy/gn*0.9,'gr','aht');
        P.math(g,x-gx/gn*0.9,y-gy/gn*0.9,'\\(-\\nabla f\\)','t','start',8,10);
      }
      P.arrow(g,x,y,x+Math.cos(th)*0.7,y+Math.sin(th)*0.7,'path','ah');
      P.dot(g,x,y,7,'pt');P.dot(g,2,-1,6,'pt t');
      // variation au premier ordre : ∇f·u(θ), pour un déplacement unité
      const gq=Q.layer('a');
      Q.poly(gq,Array.from({length:361},(_,i)=>[i,gx*Math.cos(i*Math.PI/180)+gy*Math.sin(i*Math.PI/180)]),'curve');
      Q.line(gq,STG.deg,-10,STG.deg,10,'ref');
      const val=gx*Math.cos(th)+gy*Math.sin(th);
      Q.dot(gq,STG.deg,Math.max(-10,Math.min(10,val)),7,'pt');
      Q.dot(gq,0,gx,5,'pt k');Q.dot(gq,90,gy,5,'pt k');
      put(el._ro,`<table><tr><td>\\(\\nabla f(${tn(x,1)},${tn(y,1)})\\)</td><td class="n"><b>(${fmt(gx,2)} ; ${fmt(gy,2)})</b></td></tr>
        <tr><td>déplacement horizontal : \\(\\partial_xf\\)</td><td class="n">${fmt(gx,2)}</td></tr>
        <tr><td>déplacement vertical : \\(\\partial_yf\\)</td><td class="n">${fmt(gy,2)}</td></tr>
        <tr><td>direction \\(\\theta\\) choisie : \\(\\nabla f\\cdot u\\)</td><td class="n"><b class="${val<0?'ok':'bad'}">${fmt(val,2)}</b></td></tr></table>`);
      el._s.set(STG.deg);
    };
    el._draw=draw;
  }
  el._draw()}
W.gradient=widgetGradient;

// ============ Exercice qGRj : f(x,y)=x³−3x²y+y³, un singe-selle ===============
const fSel=(x,y)=>x*x*x-3*x*x*y+y*y*y;
const gSel=th=>fSel(Math.cos(th),Math.sin(th));
const STS={deg:45};
function widgetSelle(el){
  if(!el._ok){
    el._ok=true;
    const [L,R]=twoCols(el,470);
    const svg=mk('svg',{},L);
    const P=el._P=new Plot(svg,{w:470,h:470,xr:[-3,3],yr:[-3,3],m:{l:34,r:10,t:10,b:28}});
    P.axes({xl:'\\(x\\)',yl:'\\(y\\)',xt:[-3,-2,-1,0,1,2,3],yt:[-3,-2,-1,0,1,2,3],grid:false});
    P.heat(P.layer('h'),fSel,54,v=>{const a=0.10+0.6*Math.tanh(Math.abs(v)/10);return v>0?`rgba(184,93,63,${a})`:`rgba(58,143,143,${a})`});
    P.contours(P.layer('lv'),fSel,[-16,-8,-4,-2,2,4,8,16],130,'lvl');
    // niveau 0 : trois droites y = t x, avec t³ − 3t + 1 = 0
    const gz=P.layer('z');
    for(const k of [2,8,14]){const t=2*Math.cos(k*Math.PI/9);P.line(gz,-3,-3*t,3,3*t,'red')}
    const svg2=mk('svg',{},R);
    const Q=el._Q=new Plot(svg2,{w:640,h:260,xr:[0,360],yr:[-2.6,2.6],m:{l:44,r:14,t:12,b:34}});
    Q.axes({xl:'\\(\\theta\\) (degrés)',yl:'\\(g(\\theta)\\)',xt:[0,60,120,180,240,300,360],yt:[-2,-1,0,1,2]});
    const gf=Q.layer('f');
    Q.poly(gf,Array.from({length:361},(_,i)=>[i,gSel(i*Math.PI/180)]),'curve');
    for(const k of [2,8,14]){const t=2*Math.cos(k*Math.PI/9),a=Math.atan(t)*180/Math.PI;for(const d of [a,a+180,a+360])if(d>=0&&d<=360)Q.dot(gf,d,0,5,'pt k')}
    const ctl=html('div',{class:'controls',style:'margin:8px 0 0'},R);
    el._s=slider(ctl,{label:'rayon \\(\\theta\\) =',min:0,max:360,step:1,value:STS.deg,show:v=>v+'°',onInput:v=>{STS.deg=v;draw()}});
    button(ctl,'\\(y=x\\)',()=>{STS.deg=45;draw()});
    el._ro=html('div',{class:'ro',style:'margin-top:6px'},R);
    const draw=()=>{
      const th=STS.deg*Math.PI/180,gv=gSel(th);
      const g=P.layer('a');
      P.line(g,0,0,3*Math.cos(th)*1.5,3*Math.sin(th)*1.5,'path');
      const gq=Q.layer('m');Q.line(gq,STS.deg,-2.6,STS.deg,2.6,'ref');Q.dot(gq,STS.deg,gv,7,'pt');
      put(el._ro,`<p class="small" style="margin:0 0 6px"><b style="color:var(--red)">▬</b> niveau \\(f=0\\) : trois droites ; orange \\(f>0\\), vert \\(f<0\\)</p><p style="margin:0 0 4px">Sur le rayon d’angle \\(\\theta\\) : \\(f(r\\cos\\theta,r\\sin\\theta)=r^3\\,g(\\theta)\\)</p>
        <table><tr><td>\\(g(\\theta)\\)</td><td class="n"><b class="${gv>0?'wr':'ok'}">${fmt(gv,3)}</b></td><td class="small">${gv>0.005?'\\(f>0\\) près de l’origine':gv<-0.005?'\\(f<0\\) près de l’origine':'sur la ligne \\(f=0\\)'}</td></tr></table>`);
      el._s.set(STS.deg);
    };
    el._draw=draw;
  }
  el._draw()}
W.selle=widgetSelle;

// Mise à l'échelle dans la largeur disponible, et hauteur signalée à la page parente.
const NATURAL=1160,inner=$('#inner'),stage=$('#stage');
function fit(){
  const k=Math.min(2,document.documentElement.clientWidth/NATURAL);
  inner.style.transform='scale('+k+')';
  const h=Math.ceil(inner.offsetHeight*k);
  stage.style.height=h+'px';
  parent.postMessage({oym:'animation-size',height:h},'*')}
const el=$('[data-w]');W[el.dataset.w](el);
new ResizeObserver(fit).observe(inner);window.addEventListener('resize',fit);fit();
</script></body></html>
