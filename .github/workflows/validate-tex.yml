name: Validation fichiers LaTeX

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
    paths:
      - 'src/**/*.tex'
      - '_preambules/**/*.tex'
      - 'scripts/check_exercise_sources.py'
      - 'template_exercice.tex'
      - '.github/workflows/validate-tex.yml'

jobs:
  validate:
    name: Validation structurelle
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate exercise sources
        run: |
          python3 scripts/check_exercise_sources.py --csv validation_report.csv

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation_report.csv
          retention-days: 30
