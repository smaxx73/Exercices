name: Validation manuelle

on:
  workflow_dispatch:

jobs:
  validate-manual:
    name: Validation manuelle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate exercise sources
        run: |
          python3 scripts/check_exercise_sources.py --csv validation_report.csv
          python3 scripts/check_image_assets.py --csv image_report.csv

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            validation_report.csv
            image_report.csv
          retention-days: 30
